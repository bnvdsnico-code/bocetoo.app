# Cloudflare Workers con archivos estáticos (sirve public/ y el asistente en /api/asistente).
# Si el proyecto es de Cloudflare Pages, Pages ignora este archivo y usa la carpeta functions/.
name = "bocetoo-app"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# Conserva las variables cargadas en el panel de Cloudflare al publicar
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Workers AI para el asistente (plan gratis, sin tarjeta)
[ai]
binding = "AI"

# Suscripciones de Mercado Pago: registro de suscripciones e IDs de planes
[[kv_namespaces]]
binding = "SUSCRIPCIONES"
id = "c9298ba458d14debbf1dcf923f528247"

[vars]
APP_URL = "https://bocetoo-app.bnvds-nico.workers.dev"
