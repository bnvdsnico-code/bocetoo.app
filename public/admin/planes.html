<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planes de Mercado Pago · boceto</title>
<meta name="robots" content="noindex, nofollow">
<style>
body{margin:0;background:#F7F6F4;color:#111;font-family:Inter,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:28px}p{margin:0;line-height:1.55;color:#3A3A3A}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input{font:inherit;font-size:16px;height:48px;padding:0 14px;border:1.5px solid #CFCFCF;border-radius:12px}
button{font:inherit;font-weight:600;font-size:16px;min-height:50px;border:0;border-radius:999px;background:#111;color:#fff;cursor:pointer}
button:disabled{opacity:.5}
pre{white-space:pre-wrap;background:#fff;border:1px solid #E2E2E2;border-radius:14px;padding:14px;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Planes de suscripción</h1>
<p>Crea en Mercado Pago los planes "Tu diplomatura" ($63.000 × 4 meses) y "Todas las diplomaturas" ($83.000 por mes). Se hace una sola vez; si ya existen, no se duplican.</p>
<label>Clave de administración (ADMIN_KEY)<input id="k" type="password" autocomplete="off"></label>
<button id="b" type="button">Crear o verificar planes</button>
<pre id="o" aria-live="polite">Todavía no se hizo nada.</pre>
</main>
<script>
document.getElementById("b").addEventListener("click", async (ev) => {
  const b = ev.currentTarget, o = document.getElementById("o");
  b.disabled = true; o.textContent = "Procesando…";
  try {
    const r = await fetch("/api/admin/planes", { method: "POST", headers: { "x-admin-key": document.getElementById("k").value } });
    const d = await r.json().catch(() => ({}));
    o.textContent = r.ok ? JSON.stringify(d.planes, null, 2) : (d.message || "Error " + r.status);
  } catch (e) { o.textContent = "No se pudo conectar. Intentá nuevamente."; }
  finally { b.disabled = false; }
});
</script>
</body>
</html>
